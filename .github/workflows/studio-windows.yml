name: MathBank Studio · Windows
on:
  push:
    branches: [main, rebuild/mathbank-studio]
    tags: ['studio-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock
      - name: Run new implementation tests
        run: python -m pytest -q
      - name: Read application version
        shell: pwsh
        run: |
          $StudioVersion = python -c "from studio import VERSION; print(VERSION)"
          if ($StudioVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid application version' }
          "STUDIO_VERSION=$StudioVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build independent Windows application
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Run packaged desktop acceptance
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          foreach ($StudioScale in @('1', '1.5', '2')) {
            $env:QT_SCALE_FACTOR = $StudioScale
            $p = Start-Process -FilePath ./dist/MathBankStudio/MathBankStudio.exe -ArgumentList '--self-test' -PassThru
            if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "Packaged acceptance timed out at scale $StudioScale" }
            if ($p.ExitCode -ne 0) { Get-Content studio-selftest.json; throw "Packaged acceptance failed at scale $StudioScale" }
            $result = Get-Content studio-selftest.json -Raw | ConvertFrom-Json
            if (-not $result.ok -or -not $result.guided_full_workflow -or -not $result.gui_question_classification -or -not $result.native_screen_recovery -or -not $result.rendered_pixels -or -not $result.responsive_layout -or -not $result.individual_question_cards -or -not $result.individual_question_files -or -not $result.renderer_restart -or $result.rendering_mode -ne 'software' -or $result.qt_platform -ne 'windows' -or $result.display_scale -ne $StudioScale) { throw 'Desktop acceptance result invalid' }
            Get-Content studio-selftest.json
            Copy-Item studio-selftest.json "dist/MathBankStudio/selftest-scale-$StudioScale.json"
          }
          Copy-Item studio-selftest.json dist/MathBankStudio/studio-selftest.json
      - name: Create download archive
        shell: pwsh
        run: |
          $Archive = "dist/MathBankStudio-${env:STUDIO_VERSION}-Windows-x64.zip"
          Compress-Archive -Path dist/MathBankStudio -DestinationPath $Archive
          $hash = (Get-FileHash $Archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $Archive -Leaf)" | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MathBankStudio-Windows-x64
          path: |
            dist/MathBankStudio-*-Windows-x64.zip
            dist/SHA256SUMS.txt
            studio-selftest.json
      - name: Publish direct Windows download
        if: startsWith(github.ref, 'refs/tags/studio-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Archive = "dist/MathBankStudio-${env:STUDIO_VERSION}-Windows-x64.zip"
          gh release create $env:GITHUB_REF_NAME $Archive dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "MathBank Studio ${env:STUDIO_VERSION} · Windows 화면 복구와 개별 문항" --notes-file docs/RELEASE.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release failed' }
