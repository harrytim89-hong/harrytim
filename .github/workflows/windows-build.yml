name: MathBank 0.3.1 Windows download
on:
  workflow_dispatch:
  push:
    branches: [codex/mathbank-0-3-1-download]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Test, build and verify packaged Windows program
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MathBankDesktop-0.3.1-Windows-x64
          path: dist/MathBankDesktop/
          if-no-files-found: error
          retention-days: 30
      - name: Publish a direct download after all Windows checks pass
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ReleaseTag = 'mathbank-v0.3.1'
          $Archive = 'dist/MathBankDesktop-Windows-x64.zip'
          $Hash = (Get-FileHash -Algorithm SHA256 $Archive).Hash.ToLowerInvariant()
          "$Hash  MathBankDesktop-Windows-x64.zip" | Out-File dist/SHA256SUMS.txt -Encoding ascii
          gh release create $ReleaseTag $Archive dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'MathBank Desktop 0.3.1' --notes-file docs/RELEASE_NOTES_KO.md
          if ($LASTEXITCODE -ne 0) { throw 'Direct-download release creation failed.' }
