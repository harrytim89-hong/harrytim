name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main, codex/mathbank-efficiency-0.3.0]
    paths:
      - 'mathbank/**'
      - 'scripts/**'
      - 'tests/**'
      - 'launch_mathbank.py'
      - 'requirements.lock'
      - 'docs/USER_GUIDE_KO.md'
      - 'docs/THIRD_PARTY.md'
      - '.github/workflows/windows-build.yml'
jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build and unit tests
        shell: pwsh
        run: |
          try {
            & ./scripts/build_windows.ps1 *>&1 | Tee-Object -FilePath build.log
          } catch {
            $Diagnostic = if (Test-Path build.log) { (Get-Content build.log -Tail 65) -join "`n" } else { $_.ToString() }
            $Diagnostic = $Diagnostic.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows build diagnostics::$Diagnostic"
            throw
          } finally {
            if (Test-Path build.log) {
              '## Windows build diagnostic output' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              '```text' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              Get-Content build.log -Tail 100 | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: MathBankDesktop-Windows-x64
          path: dist/MathBankDesktop/
          if-no-files-found: error
          retention-days: 7
