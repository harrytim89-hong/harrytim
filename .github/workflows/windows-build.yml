name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mathbank/**'
      - 'scripts/**'
      - 'tests/**'
      - 'launch_mathbank.py'
      - 'requirements.lock'
      - '.github/workflows/windows-build.yml'
jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build and unit tests
        shell: pwsh
        run: |
          try {
            & ./scripts/build_windows.ps1 *>&1 | Tee-Object -FilePath build.log
          } finally {
            if (Test-Path build.log) {
              '## Windows build diagnostic output' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              '```text' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              Get-Content build.log -Tail 100 | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: MathBankDesktop-Windows-x64
          path: dist/MathBankDesktop-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7
